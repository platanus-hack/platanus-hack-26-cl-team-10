<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de OT</title>
<style>
  :root{--ok:#2f7d5b;--ok-bg:#e3f3ea;--warn:#9a6400;--warn-bg:#fdf3d6;--err:#b42318;--err-bg:#fdeceb;--line:#d9dee5;--muted:#5b6673}
  body{font:16px/1.5 system-ui;margin:0;background:#f7f8fa;color:#16202b}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#141c26;color:#eef2f7}
  header input,header button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #2e3b4e;background:#1d2734;color:#eef2f7}
  main{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:16px 20px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  #video{width:100%;border-radius:10px;background:#000;min-height:200px;display:block}
  .marco{position:relative} #cajas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .nivel{font-size:22px;font-weight:800;padding:4px 14px;border-radius:999px;display:inline-block}
  .ok{background:var(--ok-bg);color:var(--ok)} .warning{background:var(--warn-bg);color:var(--warn)} .error{background:var(--err-bg);color:var(--err)}
  #avisos{list-style:none;padding:0;margin:10px 0 0}
  #avisos li{padding:10px 12px;border-radius:10px;margin:6px 0;transition:opacity .4s,transform .4s}
  #avisos li.sale{opacity:0;transform:translateX(30px)}
  #avisos li small{display:block;opacity:.8}
  #pasos li{margin:3px 0} .verificado{color:var(--ok)} .en_conflicto{color:var(--err);font-weight:700} .no_verificado{color:var(--muted)}
  #bitacora{max-height:340px;overflow:auto;font-size:15px;margin:0;padding-left:18px}
  #bitacora li{margin:4px 0}
  .muted{color:var(--muted);font-size:15px}
  header .muted{color:#a9b4c2}
  header .derecha{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  header button.principal{background:#2f7d5b;border-color:#2f7d5b}
  #sensores{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
  .sensor{border:1px solid var(--line);border-radius:10px;padding:8px 10px;transition:background .3s}
  .sensor b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .sensor small{color:var(--muted)}
  .sensor.si{background:var(--ok-bg);border-color:var(--ok)} .sensor.no{background:#f2f4f7}
  .sensor.nuevo{background:#eef4ff}
  #accion{min-height:1.5em}
</style>
</head>
<body>
<header>
  <b>Monitor</b>
  <label>OT <input id="ot" value="ot-loto" size="16"></label>
  <button id="conectar">Conectar</button>
  <span id="conexion" class="muted">desconectado</span>
  <span class="derecha">
    <button id="declarar" title="El operario dice que hizo el paso actual: si el modelo del edge no está seguro, decide el VLM">Declarar paso</button>
    <button id="nueva" class="principal" title="Abre una OT nueva con la pauta LOTO y la une al edge">Nueva demo LOTO</button>
  </span>
</header>
<main>
  <div>
    <div class="card"><div class="marco"><img id="video" alt="Video del edge"><canvas id="cajas" aria-hidden="true"></canvas></div><p class="muted" id="video-estado">Sin sesión: no hay edge que mirar.</p><p class="muted" id="vistos"></p></div>
    <div class="card" style="margin-top:16px"><h3 style="margin:0 0 6px">Pasos</h3><ol id="pasos"></ol></div>
  </div>
  <div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin:0">Sensores en vivo</h3>
      <div id="sensores"><p class="muted">Esperando lecturas del edge…</p></div>
      <p class="muted" id="accion"></p>
    </div>
    <div class="card">
      <div>Calificación de la OT <span id="nivel" class="nivel ok">ok</span> <span class="muted" id="certeza"></span></div>
      <ul id="avisos"></ul>
      <p class="muted" id="sin-avisos">Sin avisos activos.</p>
    </div>
    <div class="card" style="margin-top:16px"><h3 style="margin:0 0 6px">Bitácora en vivo</h3><ol id="bitacora" reversed></ol></div>
  </div>
</main>
<script>
// Un aviso existe mientras el servidor lo mande en `calificacion.avisos`. Cuando el sensor
// se corrige, el siguiente mensaje ya no lo trae y aquí se va con una animación.
let ws = null, ultimo = 0;
const $ = id => document.getElementById(id);

function pintarCalificacion(c) {
  $("nivel").className = "nivel " + c.nivel; $("nivel").textContent = c.nivel;
  $("certeza").textContent = `certeza ${Math.round(c.certeza * 100)}%`;
  const lista = $("avisos"), vivos = new Set();
  (c.avisos || []).forEach(a => {
    const clave = a.nivel + "|" + a.motivos[0];
    vivos.add(clave);
    let li = [...lista.children].find(x => x.dataset.clave === clave);
    if (!li) { li = document.createElement("li"); li.dataset.clave = clave; lista.append(li); }
    li.className = a.nivel;
    li.innerHTML = `<b>${a.nivel.toUpperCase()}</b> · capa ${a.capa ?? "persona"} · certeza ${Math.round(a.certeza * 100)}%<small>${a.motivos.join(" · ")}</small>`;
  });
  [...lista.children].forEach(li => {
    if (!vivos.has(li.dataset.clave) && !li.classList.contains("sale")) {
      li.classList.add("sale"); setTimeout(() => li.remove(), 400);
    }
  });
  $("sin-avisos").style.display = (c.avisos || []).length ? "none" : "block";
}

function pintarPasos(estado) {
  $("pasos").innerHTML = estado.pasos.map(p =>
    `<li class="${p.estado}">${p.titulo}${p.id === estado.paso_actual ? " ←" : ""}</li>`).join("");
}

function anotar(ev) {
  ultimo = Math.max(ultimo, ev.id || 0);
  const li = document.createElement("li");
  const c = ev.calificacion ? ` [${ev.calificacion.nivel}]` : "";
  li.textContent = `${ev.ts.slice(11, 19)} ${ev.tipo}${ev.paso_id ? " " + ev.paso_id : ""}${c}: ${ev.detalle}`;
  $("bitacora").prepend(li);
}

function video(v) {
  if (!v) return;
  $("video").src = v.url + "?t=" + Date.now();
  $("video-estado").textContent = v.hay_video ? `Video de ${v.edge_id}` : `Esperando la cámara de ${v.edge_id} (/camara)`;
}

// Las cajas vienen normalizadas 0-1: se escalan al tamaño con que se ve el video.
// Si deja de llegar detección por 1 s, se borran para no mostrar algo viejo.
let borrarCajas = null;
function pintarCajas(d) {
  const cv = $("cajas"), img = $("video");
  cv.width = img.clientWidth; cv.height = img.clientHeight;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  g.lineWidth = 3; g.font = "bold 15px system-ui";
  d.objetos.forEach(o => {
    const [x1, y1, x2, y2] = o.caja, x = x1 * cv.width, y = y1 * cv.height;
    const color = o.conf >= 0.8 ? "#2fbf71" : "#f5a524";  // verde: certeza alta; ámbar: dudosa
    g.strokeStyle = color; g.strokeRect(x, y, (x2 - x1) * cv.width, (y2 - y1) * cv.height);
    const t = `${o.clase} ${Math.round(o.conf * 100)}%`;
    g.fillStyle = color; g.fillRect(x, Math.max(0, y - 20), g.measureText(t).width + 10, 20);
    g.fillStyle = "#000"; g.fillText(t, x + 5, Math.max(15, y - 5));
  });
  $("vistos").textContent = d.objetos.length
    ? "Ve: " + d.objetos.map(o => `${o.clase} (${Math.round(o.conf * 100)}%)`).join(", ") : "Ve: nada";
  clearTimeout(borrarCajas);
  borrarCajas = setTimeout(() => { g.clearRect(0, 0, cv.width, cv.height); $("vistos").textContent = ""; }, 1000);
}

async function refrescarPasos(ot) {
  const r = await fetch(`/ot/${ot}`); if (r.ok) pintarPasos(await r.json());
}

function conectar() {
  const ot = $("ot").value.trim();
  if (ws) { ws.onclose = null; ws.close(); }
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ot/${encodeURIComponent(ot)}/stream?desde=${ultimo}`;
  ws = new WebSocket(url);
  ws.onopen = () => $("conexion").textContent = "en vivo";
  ws.onclose = () => { $("conexion").textContent = "reconectando…"; setTimeout(conectar, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.tipo === "snapshot") {
      if (ultimo === 0) $("bitacora").innerHTML = "";
      m.bitacora.forEach(anotar); pintarPasos(m.estado); pintarCalificacion(m.calificacion); video(m.video);
      if (!m.sesion) $("video-estado").textContent =
        "Esta OT no tiene un edge unido, así que no hay cámara. Usa «Nueva demo LOTO» para abrir una con el edge.";
      edge = m.sesion ? m.sesion.edge_id : edge;
      Object.entries(m.sensores || {}).forEach(([k, v]) => pintarSensor(k, v, false));
    } else if (m.tipo === "evento") {
      anotar(m.evento); if (m.evento.tipo === "veredicto") refrescarPasos(ot);
    } else if (m.tipo === "calificacion_ot") {
      pintarCalificacion(m.calificacion);
    } else if (m.tipo === "sesion") {
      video(m.video);
    } else if (m.tipo === "detecciones") {
      pintarCajas(m);
    } else if (m.tipo === "lectura") {
      pintarSensor(m.sensor_id, m.valor, true);
    }
  };
}

// ─── Sensores en vivo: llegan como mensajes `lectura` del stream de la OT ───────────────
const SENSORES = {  // los del edge del demo, en el orden en que se leen; el resto se muestra igual
  operario: ["Operario", v => v === "presente", ""], equipo: ["Equipo", v => v === "frio", ""],
  dist_cm: ["Distancia", null, " cm"], temp_c: ["Temperatura", null, " °C"], hum_pct: ["Humedad", null, " %"],
};
let edge = "edge-mac";
function pintarSensor(id, valor, vivo) {
  if (!vivo && !(id in SENSORES)) return;  // del snapshot solo los del demo: la tabla es global
  const caja = $("sensores");
  if (caja.querySelector("p")) caja.innerHTML = "";
  let el = caja.querySelector(`[data-id="${id}"]`);
  if (!el) {
    el = document.createElement("div"); el.className = "sensor"; el.dataset.id = id;
    el.innerHTML = `<small>${(SENSORES[id] || [id])[0]}</small><b></b>`;
    caja.append(el);
  }
  const [, positivo, unidad] = SENSORES[id] || [id, null, ""];
  el.querySelector("b").textContent = valor + (unidad || "");
  el.classList.toggle("si", !!positivo && positivo(valor));
  el.classList.toggle("no", !!positivo && !positivo(valor));
  if (vivo) { el.classList.add("nuevo"); setTimeout(() => el.classList.remove("nuevo"), 300); }
}

async function llamar(metodo, url, cuerpo) {
  const r = await fetch(url, {method: metodo, headers: {"content-type": "application/json"},
                              body: cuerpo ? JSON.stringify(cuerpo) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || j.regla || r.status);
  return j;
}

// Una OT nueva con la pauta LOTO, unida al edge que se venía mirando: para repetir la demo.
async function nuevaDemo() {
  const ot = "ot-loto-" + new Date().toTimeString().slice(0, 8).replaceAll(":", "");
  $("accion").textContent = "Abriendo una OT nueva…";
  try {
    await llamar("POST", "/pauta/demo?pauta=loto");
    await llamar("POST", `/ot/${ot}/abrir?pauta_id=pauta-loto-escritorio`);
    await llamar("POST", `/ot/${ot}/sesion`, {edge_id: edge, operario: "operario:A"});
    $("ot").value = ot; history.replaceState(null, "", `?ot=${ot}`);
    ultimo = 0; $("bitacora").innerHTML = ""; conectar();
    $("accion").textContent = `OT ${ot} abierta con ${edge}. Empieza por el paso 1.`;
  } catch (e) { $("accion").textContent = "No se pudo abrir la OT: " + e.message; }
}

// El operario dice que hizo el paso actual: capa 2 si el modelo del edge está seguro, si no el VLM.
async function declarar() {
  $("accion").textContent = "Verificando el paso…";
  try {
    const r = await llamar("POST", `/ot/${$("ot").value.trim()}/declarar`, {actor: "operario:A", texto: "hecho"});
    $("accion").textContent = `${r.paso}: ${r.estado} (capa ${r.capa ?? "persona"}) · ${r.detalle}`;
  } catch (e) { $("accion").textContent = "No se pudo declarar: " + e.message; }
}

$("conectar").onclick = () => { ultimo = 0; $("bitacora").innerHTML = ""; conectar(); };
$("nueva").onclick = nuevaDemo;
$("declarar").onclick = declarar;
// Sin ?ot= se abre la OT que algún edge está ejecutando ahora (la sesión más reciente):
// así el home siempre muestra la cámara en vivo.
async function iniciar() {
  const otDeLaUrl = new URLSearchParams(location.search).get("ot");
  if (otDeLaUrl) {
    $("ot").value = otDeLaUrl;
  } else {
    try {
      const sesiones = await (await fetch("/sesiones")).json();
      const ultima = sesiones.sort((a, b) => a.desde.localeCompare(b.desde)).pop();
      if (ultima) { $("ot").value = ultima.ot_id; edge = ultima.edge_id; }
    } catch (e) { /* sin sesiones: queda la OT por defecto */ }
  }
  conectar();
}
iniciar();
</script>
</body>
</html>
