<title>Factum · simulador del protocolo a la OT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- La ejecución verificada paso a paso, con el protocolo, las pautas y la OT ya hechos como un pipeline al lado,
     y lo que pasa por detrás de cada etapa. Al terminar, la misma pauta se ejecuta con otros operarios (hasta seis),
     y el reporte junta todas las ejecuciones por paso: de ahí salen las propuestas que alimentan la v2 de la pauta. Cinco casos: el demo de 2 minutos con una correa a escala, el cambio de polín completo en una correa de faena, un brazo robótico, una celda de media tensión y una excavadora.
     Lo que responde cada llamada y cada tramo del guion sale de correr app/ en una base en memoria;
     las pautas de energía y construcción son las de datos/, y las del brazo y del polín, las del PR #34. Lo que no está construido va marcado, y lo que está en un PR sin integrar también.
     Un solo archivo, sin build ni red. Si el código cambia, se corrige en el mismo commit. -->
<style>

/* ─── El lenguaje del monitor desplegado (app/estatico/monitor.html): tinta con rejilla, títulos en la letra de
   matriz, rótulos mono entre corchetes y celdas de 1 px. Lima es verificado y activo, ámbar atención, rojo peligro. ─── */
:root{--fondo:#0a0c0a;--panel:#101310;--alto:#171b16;--linea:#252a23;--linea-2:#3d4439;--texto:#eef2e9;--tenue:#9ca696;--lima:#d4ff9e;--ambar:#ffc24d;--rojo:#ff4433;--trama:#141813;--tinta:#0a0c0a;
  --titular:"Bitcount Prop Single",ui-monospace,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ink:var(--texto);--muted:var(--tenue);--line:var(--linea);--soft:var(--alto);--bg:var(--fondo);--paper:var(--panel);--brand:var(--lima);--brand-soft:var(--alto);
  --ok:var(--lima);--ok-bg:rgba(212,255,158,.09);--warn:var(--ambar);--warn-bg:rgba(255,194,77,.1);--err:var(--rojo);--err-bg:rgba(255,68,51,.12);--deep:var(--fondo);
  --teal:var(--tenue);--teal-bg:var(--alto);--persona:var(--tenue);--persona-bg:var(--alto);--stub:var(--linea-2);--estado:var(--lima);color-scheme:dark}
body[data-nivel="warning"]{--estado:var(--ambar)} body[data-nivel="error"]{--estado:var(--rojo)}
body{font:15px/1.5 var(--sans);color:var(--texto);background:var(--fondo);font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--trama) 1px,transparent 1px),linear-gradient(90deg,var(--trama) 1px,transparent 1px);background-size:100% 240px,25% 100%;background-attachment:fixed}
::selection{background:var(--lima);color:var(--tinta)} button:focus-visible,summary:focus-visible,:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
html{scrollbar-color:var(--linea-2) var(--fondo)}
code{background:var(--alto);color:var(--texto);border-radius:2px}
h2{font:400 clamp(22px,2vw,32px)/1.05 var(--titular);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}

.lista .num{width:34px;height:34px;border-radius:2px;background:none;border:1px solid var(--linea-2);color:var(--tenue);font:500 13px/1 var(--mono)}
.lista li.verificado{background:none;color:var(--texto)} .lista li.verificado .num{background:none;border-color:var(--lima);color:var(--lima)}

.crit{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rojo);border:1px solid rgba(255,68,51,.5);border-radius:2px;padding:2px 5px}

ado en el tablero y guarda la llave. Mientras esté puesto, nadie puede volver a dar corriente.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"bloqueo","espera":"puesto"}},{"id":"p3","orden":3,"titulo":"Probar que no arranca","instruccion":"Da la orden de partida y mira que el brazo no se mueve.","tipo_evidencia":"confirmacion","capa_minima":1,"control_critico":true},{"id":"p4","orden":4,"titulo":"Entrar a la celda","instruccion":"Recién ahora acércate al brazo.","tipo_evidencia":"sensor","capa_minima":1,"sensor":{"id":"zona","espera":"ocupada"}},{"id":"p5","orden":5,"titulo":"Ajustar la pinza","instruccion":"Aprieta el tornillo de la pinza hasta que cierre sobre la pieza.","tipo_evidencia":"camara","capa_minima":3,"pregunta_visual":"¿La pinza está cerrada y sostiene la pieza?"},{"id":"p6","orden":6,"titulo":"Salir de la celda","instruccion":"Saca la herramienta y sal de la zona del brazo.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"zona","espera":"libre"}},{"id":"p7","orden":7,"titulo":"Sacar tu candado","instruccion":"Con la celda vacía, saca tu candado del tablero.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"bloqueo","espera":"retirado"}},{"id":"p8","orden":8,"titulo":"Devolver la corriente","instruccion":"Sube el interruptor de los motores del brazo.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"energia","espera":"viva"}},{"id":"p9","orden":9,"titulo":"Probar un ciclo","instruccion":"Mira al brazo tomar y dejar una pieza, y confirma que no la suelta.","tipo_evidencia":"confirmacion","capa_minima":1}]},"regla":[{"zona":"ocupada","energia":"viva"},"PERSONA EN LA ZONA CON ENERGÍA VIVA. Salir de la zona; cortar la energía y poner el bloqueo antes de acercarse.","Celda robotizada: ADR-0010. La norma que la respalda no se buscó (Brecha)"],"pr":true,"nombres":{"energia":["corriente del brazo",{"viva":"con corriente","cortada" $("atras").addEventListener("click", () => { parar(); ir(caso, pos - 1); });
$("sigue").addEventListener("click", () => { parar(); if (pos === total() - 1) otroOperario(); else avanzar(); });
$("cero").addEventListener("click", () => { parar(); ir(caso, 3); });
$("auto").addEventListener("click", alternar);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, summary") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") { parar(); avanzar(); }
  else if (e.key === "ArrowLeft") { parar(); ir(caso, pos - 1); }
  else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); alternar(); }
});
(function visor() {
  const cv = $("c3d"); let a = null;
  const libre = () => { vistaActiva = "libre"; document.querySelectorAll("[data-vista]").forEach(b => b.setAttribute("aria-pressed", "false")); };
  cv.addEventListener("pointerdown", e => { a = [e.clientX, e.clientY, vista.az, vista.el]; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* puntero sintético */ } });
  cv.addEventListener("pointermove", e => {
    if (!a) return;
    if (vistaActiva !== "libre" && Math.hypot(e.clientX - a[0], e.clientY - a[1]) > 3) libre();
    vista.az = meta.az = a[2] - (e.clientX - a[0]) * 0.008; vista.el = meta.el = Math.min(1.5, Math.max(0.05, a[3] + (e.clientY - a[1]) * 0.008)); dibujar();
  });
  cv.addEventListener("pointerup", () => { a = null; });
  cv.addEventListener("dblclick", () => mirar("general"));
  // El pellizco del trackpad llega como rueda con ctrl: acerca sin secuestrar el scroll normal.
  cv.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const z = $("zoom"); meta.dist = Math.min(+z.max, Math.max(+z.min, meta.dist * Math.exp(e.deltaY * 0.01))); z.value = meta.dist; }, {passive: false});
  $("zoom").addEventListener("input", e => { meta.dist = +e.target.value; });
  document.querySelector(".vistas").addEventListener("click", e => { const b = e.target.closest("[data-vista]"); if (b) mirar(b.dataset.vista); });
  $("capas-b").addEventListener("click", () => { const abierto = $("capas").hidden; $("capas").hidden = !abierto; $("capas-b").setAttribute("aria-expanded", abierto); });
  $("capas").addEventListener("change", e => { const k = e.target.dataset.capa; if (k) { capas[k] = e.target.checked; dibujar(); } });
  const alto = () => document.documentElement.style.setProperty("--top", document.querySelector(".top").offsetHeight + "px");
  new ResizeObserver(() => { alto(); dibujar(); }).observe($("visor"));
  window.addEventListener("resize", alto); alto();
  let antes = 0;
  (function cuadro(t) {
    const dt = Math.min(0.1, (t - antes) / 1000 || 0); antes = t;
    if (!RAPIDO) {
      const {e} = entorno(), q = seguir(e, dt), sc = escenaDe(caso), gira = sc === "brazo" && q.viva > 0.01, humea = (sc === "construccion" || sc === "camion") && q.humo > 0.04, corre = (sc === "mineria" || sc === "demo") && q.marcha > 0.01;
      const mueveVista = acercarVista(dt);
      if (gira) fase = (fase + dt / 7 * q.viva) % 1;
      if (corre) cinta = (cinta + dt * (sc === "demo" ? 11 : 17) * q.marcha) % (sc === "demo" ? 60 : 75);
      reloj += dt;
      if (enMovimiento || gira || humea || corre || mueveVista || rotulosMoviendo) dibujar();
    }
    requestAnimationFrame(cuadro);
  })(0);
})();
// Lo que pedía el enlace al abrir: una pauta de la base recién existe cuando la base responde.
const PEDIDO = location.hash.replace(/^#/, "").split("/");
(function arranque() {
  const [k, p, q] = PEDIDO;
  const inicial = k in F.casos ? k : Object.keys(F.casos)[0], b = ESCENAS[escenaDe(inicial)][1];
  $("zoom").min = Math.round(b.dist * 0.45); $("zoom").max = Math.round(b.dist * 1.9);
  const r = Math.min(MAX_EJECUCIONES, Math.max(1, parseInt(q, 10) || 1));
  while (runsDe(inicial).length < r) agregarRun(inicial);
  sincronizar(inicial);
  ir(inicial, (parseInt(p, 10) || 1) + 2, r); mirar("general", true);
  pintarBase();
  if (EMB) { try { const s = JSON.parse(localStorage.getItem(PARAMS.get("sesion") || "factum.sesion") || "null"); if (s && s.token) BASE.token = s.token; } catch (_) { /* sin sesión: rutas públicas */ } }
  // Servido por el mismo servidor (/simulador), la base es la suya y la barra lleva de vuelta al monitor.
  const enElServidor = /\/simulador\/?$/.test(location.pathname);
  if (!PARAMS.has("sinbase")) conectar(PARAMS.get("api") || PARAMS.get("base") || (enElServidor ? location.origin : BASE_DEMO));
  document.body.dataset.listo = "1";
})();
