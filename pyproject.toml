[project]
name = "mantenimiento-verificado"
version = "0.1.0"
description = "Esqueleto del flujo de mantenimiento verificado: team-10, Platanus Hack 26"
requires-python = ">=3.12,<3.15"  # onnxruntime (detector en el servidor) no tiene ruedas para 3.15
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.115",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false
