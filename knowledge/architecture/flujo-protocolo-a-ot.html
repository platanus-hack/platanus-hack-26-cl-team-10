<!-- El flujo completo en una sola pantalla: protocolo, pautas, OT y ejecución, con lo que pasa por detrás
     en cada etapa. Cinco casos: el demo de 2 minutos con una correa a escala, el cambio de polín completo en una correa de faena, un brazo robótico, una celda de media tensión y una excavadora.
     Lo que responde cada llamada y cada tramo del guion sale de correr app/ en una base en memoria;
     las pautas de energía y construcción son las de datos/, y las del brazo y del polín, las del PR #34. Lo que no está construido va marcado, y lo que está en un PR sin integrar también.
     Un solo archivo, sin build ni red. Si el código cambia, se corrige en el mismo commit. -->
<style>

.entra{margin:0;padding-left:20px} .entra li{margin:0 0 6px}

</style>

<body>
<header><div class="wrap">
  <h1>Del protocolo a la OT ejecutada</h1>
  <p>El flujo completo de Factum en cuatro etapas, y lo que pasa por detrás en cada una. Elige un caso y avanza.</p>
</div></header>
<div class="barra"><div class="wrap"><div id="casos" role="group" aria-label="Casos"></div><ol id="flujo" aria-label="Etapas"></ol></div></div>
<main class="wrap">
  <section>
    <div class="card"><div id="vista"></div>
      <div class="mandos"><button class="boton" id="atras">← Atrás</button><button class="boton primario" id="sigue">Siguiente →</button><button class="boton" id="auto">▶ Reproducir</button><span id="cuenta"></span><button class="boton" id="cero" style="margin-left:auto">Volver al inicio</button></div>
    </div>
    <div class="visor"><canvas id="c3d" aria-label="La estación en tres dimensiones"></canvas>
      <div class="pie-v"><span>Arrastra para girar · <button id="vista-cero">volver a la vista inicial</button></span><span><label for="zoom">Distancia</label><input type="range" id="zoom" min="10" max="400" value="100"></span></div>
    </div>
  </section>
  <aside><h2>Por detrás</h2><div id="detras"></div></aside>
</main>

ado en el tablero y guarda la llave. Mientras esté puesto, nadie puede volver a dar corriente.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"bloqueo","espera":"puesto"}},{"id":"p3","orden":3,"titulo":"Probar que no arranca","instruccion":"Da la orden de partida y mira que el brazo no se mueve.","tipo_evidencia":"confirmacion","capa_minima":1,"control_critico":true},{"id":"p4","orden":4,"titulo":"Entrar a la celda","instruccion":"Recién ahora acércate al brazo.","tipo_evidencia":"sensor","capa_minima":1,"sensor":{"id":"zona","espera":"ocupada"}},{"id":"p5","orden":5,"titulo":"Ajustar la pinza","instruccion":"Aprieta el tornillo de la pinza hasta que cierre sobre la pieza.","tipo_evidencia":"camara","capa_minima":3,"pregunta_visual":"¿La pinza está cerrada y sostiene la pieza?"},{"id":"p6","orden":6,"titulo":"Salir de la celda","instruccion":"Saca la herramienta y sal de la zona del brazo.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"zona","espera":"libre"}},{"id":"p7","orden":7,"titulo":"Sacar tu candado","instruccion":"Con la celda vacía, saca tu candado del tablero.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"bloqueo","espera":"retirado"}},{"id":"p8","orden":8,"titulo":"Devolver la corriente","instruccion":"Sube el interruptor de los motores del brazo.","tipo_evidencia":"sensor","capa_minima":1,"control_critico":true,"sensor":{"id":"energia","espera":"viva"}},{"id":"p9","orden":9,"titulo":"Probar un ciclo","instruccion":"Mira al brazo tomar y dejar una pieza, y confirma que no la suelta.","tipo_evidencia":"confirmacion","capa_minima":1}]},"regla":[{"zona":"ocupada","energia":"viva"},"PERSONA EN LA ZONA CON ENERGÍA VIVA. Salir de la zona; cortar la energía y poner el bloqueo antes de acercarse.","Celda robotizada: ADR-0010. La norma que la respalda no se buscó (Brecha)"],"pr":true,"nombres":{"energia":["corriente del brazo",{"viva":"con corriente","cortada" if r.stop_reason != "end_turn":     # sin respuesta confiable: no hay pauta
    raise SinPauta(r.stop_reason)
pautas = json.loads(next(b.text for b in r.content if b.type == "text"))["pautas"]
for pauta in pautas:
    # el contrato rechaza lo mal formado
    catalogo.crear_pauta_de(cx, [protocolo_id], pauta, actor)</pre><p class="nota">Borrador sin correr: falta un protocolo real para probarlo.</p></details>`)
      + bloque(PR, `<code>POST /interno/protocolos/${c.protocolo}/pautas</code>`, `<p>La pauta se crea ya atribuida a su protocolo. La relación es de muchos a muchos y vive en una tabla aparte, <code>pauta_protocolo</code>, no en el contrato: un protocolo da varias pautas, y esta también sale de <code>prot-aislamiento-01</code>, el protocolo transversal de aislamiento de energías.</p>`)
      + bloque(true, "El contrato valida lo que entre", "<p>Un paso de sensor tiene que nombrar su sensor, uno de cámara su pregunta, y no se repiten ni el orden ni el id. Lo mal formado se rechaza, venga de una persona o de un modelo.</p>")
      + bloque(true, "<code>POST /pautas</code> y su aprobación", `<p>La pauta nace sin aprobar, y una persona la aprueba una sola vez antes de que se pueda usar. En la puesta en marcha, esa persona es quien revisa lo que propuso el modelo.</p><pre>${jsonCorto(c.real.crear, ["id", "version", "pasos", "aprobada"])}\n${jsonCorto(c.real.aprobar, ["id", "version", "aprobada"])}</pre>
        <p class="nota">${c.pr ? "Esta pauta está escrita a mano y llega con el PR #34. Separa aislar, bloquear y comprobar energía cero." : "Hoy esta pauta está escrita a mano, en <code>datos/</code>."}</p>`);
  } else if (etapa === 2) {
    const a = c.real.asignar;
    v = `<h3>Un servicio genera la OT</h3><p>Con las pautas aprobadas y el equipo ya instalado en la estación, esto es lo único que se repite: cada vez que hay que hacer el trabajo, el cliente pide una OT. La OT guarda qué versión de la pauta corre, se asigna a un operador, y la sesión la une a la estación.</p>
      <div class="ot-card"><b>${esc(c.ot)}</b><span>${esc(c.real.abrir.nombre)} · versión ${c.real.abrir.version} · de <code>${c.protocolo}</code></span><span>${esc(a.equipo)}</span>
      <span><span class="badge gris">${a.operador}</span> <span class="badge warning">en_ejecucion</span> <span class="badge gris">${a.cerrados} de ${a.total} pasos</span> <span class="badge gris">${esc(c.edge)}</span></span></div>`;
    d = bloque(PR, "<code>POST /cliente/ots</code>", `<p>El servicio del cliente, sin la clave del equipo. El cliente ve en <code>GET /cliente/pautas</code> las pautas que tienen una versión aprobada y al menos un protocolo, y pide una OT nombrando la pauta. El servicio elige la última versión aprobada, le pone el id a la OT y responde de qué protocolos sale.</p><pre>{"pauta_id": "${p.id}", "solicitante": "cliente:planta"}</pre><p class="nota">Por dentro llama a la misma apertura de abajo. Falta una credencial por cliente.</p>`)
      + bloque(true, `<code>POST /ot/${c.ot}/abrir</code>`, `<p>Solo desde una pauta aprobada. Guarda la versión y escribe la primera fila de la bitácora: «${esc(c.apertura[0][1])}».</p><pre>${jsonCorto(c.real.abrir)}</pre>`)
      + bloque(true, `<code>POST /ot/${c.ot}/asignar</code>`, `<p>Un supervisor la deja en manos de un operador. Quién la tiene se lee de la bitácora, no de una columna.</p><pre>${jsonCorto(a, ["operador", "estado_general", "cerrados", "total"])}</pre>`)
      + bloque(true, `<code>POST /ot/${c.ot}/sesion</code>`, `<p>Une el edge de la estación con la OT. Desde aquí cada lectura de ese edge entra a esta OT y solo a esta.</p><pre>${jsonCorto(c.real.sesion)}</pre>`);
  } else {
    const i = pos - 3, t = c.guion[i], tr = E.tramos[i], cal = E.cal;
    v = `<h3>${esc(t.t)}</h3><p>${esc(t.x)}</p>`;
    const de = pre => tr.eventos.filter(ev => (ev.evidencia || {}).clave && ev.evidencia.clave.startsWith(pre));
    const fila = (nombre, lista, calma) => { const ab = lista.find(ev => ev.tipo === "alerta"), re = lista.find(ev => ev.tipo === "alerta_resuelta"); return `<li class="${ab ? "err" : re ? "ok" : ""}"><b>${nombre}</b> ${ab ? "abre una alerta" : re ? "resuelve la alerta" : calma}</li>`; };
    const cierre = tr.eventos.filter(ev => ev.tipo === "veredicto" && ev.capa === 1 && ev.estado === "verificado");
    let entro = "", revisa = "";
    if (t.pon || t.temp) {
      if (t.temp) entro += `<p><code>POST /edge/${c.edge}/lecturas</code> ${t.temp.length > 1 ? `${t.temp.length} lecturas de` : ""} <code>temp_c</code>: ${t.temp.length > 1 ? `de ${t.temp[0]} a ${t.temp.at(-1)}` : t.temp[0]}</p>` ;
      if (t.pon) entro += `<p><code>POST /edge/${c.edge}/lecturas</code></p><p class="lecturas">${c.orden.map(s => `<span class="${tr.cambios.includes(s) ? "cambio" : ""}">${s} = ${E.sensores[s]}</span>`).join("")}</p>`;
      revisa += `<ol class="revisiones">${fila("Seguridad", de("seguridad:"), "sin peligro")}<li class="${cierre.length ? "ok" : ""}"><b>Paso actual</b> ${cierre.length ? "cierra " + cierre.map(ev => ev.paso_id).join(" y ") : "ninguna lectura lo cierra"}</li>${fila("Controles", de("control:"), "ninguno deshecho")}${fila("Orden", de("orden:"), "nada adelantado")}<li class="${t.temp ? (de("senal:").some(ev => ev.tipo === "alerta") ? "err" : de("senal:").length ? "ok" : "") : ""}"><b>Señal</b> ${t.temp ? (de("senal:").some(ev => ev.tipo === "alerta") ? "la temperatura se salió de lo normal: avisa sin detener" : de("senal:").length ? "la temperatura volvió a lo normal" : "senal:temp_c" in E.motor.activas() ? "la temperatura sigue fuera de lo normal: el aviso amarillo sigue abierto" : "temperatura normal") : "no hay lecturas numéricas"}</li></ol>`;
    }
    if (t.dice) {
      const v2 = tr.eventos.filter(ev => ev.tipo === "veredicto").at(-1);
      entro += `<p><code>POST /ot/${c.ot}/declarar</code> «${esc(t.dice)}»</p>`;
      revisa += v2.capa === 3 ? `<ol class="revisiones"><li><b>Detector</b> el paso no trae una clase que conozca: no decide</li><li class="ok"><b>Juez de cámara</b> responde sí con ${corto(K.CONF_FORZADA)} a «${esc(E.motor.pasos.find(x => x.id === v2.paso_id).pregunta_visual)}»</li></ol><p class="nota">La respuesta del juez está fijada para esta corrida. En vivo responde el modelo de visión sobre el cuadro.</p>`
        : `<ol class="revisiones"><li class="ok"><b>Confirmación</b> el paso se cierra con la palabra del operario</li></ol>`;
    }
    d = `<div class="tel"><div class="barra-t"><span>${esc(c.ot)} · ${c.real.asignar.operador}</span><span><span class="badge ${cal.nivel}">${ESTADO_OT[cal.nivel]}</span></span></div>
      <ol>${enBloques(c, E.motor.pasos, x => { const est = E.estados[x.id] || "no_verificado"; return `<li class="${est} ${E.actual && E.actual.id === x.id ? "actual" : ""}"><span class="num">${x.orden}</span><span class="tit">${esc(x.titulo)}${x.control_critico ? " <i>no se salta</i>" : ""}</span><span class="cap">${esc(loQueCierra(c, x))}</span></li>`; }, (l, t) => `<li class="bloque">${l} · ${esc(t)}</li>`)}</ol>
      ${cal.avisos.map(enClaro).join("") || `<div class="sin">${E.completa ? "OT completa, sin avisos." : "Sin avisos activos."}</div>`}</div>
      <div class="pieza si"><span class="tag">construido</span><h4>Lo que entró</h4>${entro}<h4>Qué lo revisó</h4>${revisa}
      <h4>Lo que quedó en la bitácora</h4><ol class="bitacora">${tr.eventos.map(ev => { const q = E.motor.calificarEvento(ev); return `<li class="${q ? q.nivel : ""}"><b>${ev.tipo}</b>${ev.paso_id ? " " + ev.paso_id : ""}${ev.capa ? " · capa " + ev.capa : ev.tipo === "veredicto" ? " · persona" : ""}<br>${esc(ev.detalle)}</li>`; }).join("") || "<li>Nada: ninguna lectura cambió algo.</li>"}</ol>
      <p class="nota">Cada fila sale al instante por <code>WS /ot/${c.ot}/stream</code>, con la calificación de la OT.</p></div>`
      + (caso === "brazo" ? `<p class="nota borde">En este caso no están construidos el relé, el corte local del ESP32 ni la regla «${esc(c.regla[1].split(".")[0].toLowerCase())}». La pauta llega con el PR #34. La lógica que responde sí es la del servidor.</p>` : caso === "demo" ? `<p class="nota borde">La pauta y la regla «${esc(c.regla[1].split(".")[0].toLowerCase())}» están en el servidor. Falta que la placa informe si el motor gira y si la traba está puesta, y que <code>edge.py</code> lo reenvíe; hoy manda temperatura y distancia. Que el motor no parta con la mano adentro lo decide la placa; Factum lo registra.</p>` : caso === "mineria" ? `<p class="nota borde">La estación de este caso es supuesta: ninguna del equipo mide estas cuatro señales, y la pauta llega con el PR #34. La lógica que responde sí es la del servidor, con la regla de peligro de minería que ya existe.</p>` : "");
  }
  $("vista").innerHTML = v; $("detras").innerHTML = d;
  if (RAPIDO || !poses[caso]) seguir(entorno().e);
  dibujar();
  document.body.dataset.flujo = [caso, pos, pos >= 3 ? E.cal.nivel : "-", pos >= 3 ? (E.actual ? E.actual.id : "completa") : "-"].join(":");
}
function ir(k, p) { caso = k in F.casos ? k : Object.keys(F.casos)[0]; pos = Math.max(0, Math.min(total() - 1, p | 0)); const h = `#${caso}/${pos}`; if (location.hash !== h) history.replaceState(null, "", h); pintar(); }
function elegirCaso(k) { parar(); Object.assign(vista, ESCENAS[k][1]); $("zoom").value = vista.dist; $("zoom").min = Math.round(vista.dist * 0.45); $("zoom").max = Math.round(vista.dist * 1.9); ir(k, 0); }

$("casos").innerHTML = Object.entries(F.casos).map(([k, c]) => `<button data-caso="${k}" aria-pressed="false"><b>${esc(c.nombre)}</b><small>${esc(c.sub)}</small></button>`).join("");
$("casos").addEventListener("click", e => { const b = e.target.closest("[data-caso]"); if (b) elegirCaso(b.dataset.caso); });
$("flujo").addEventListener("click", e => { const b = e.target.closest("[data-etapa]"); if (b) ir(caso, +b.dataset.etapa); });
let auto = null;
const parar = () => { clearInterval(auto); auto = null; $("auto").textContent = "▶ Reproducir"; };
$("atras").addEventListener("click", () => { parar(); ir(caso, pos - 1); }); $("sigue").addEventListener("click", () => { parar(); ir(caso, pos + 1); }); $("cero").addEventListener("click", () => { parar(); ir(caso, 0); });
$("auto").addEventListener("click", () => { if (auto) return parar(); if (pos === total() - 1) ir(caso, 0); $("auto").textContent = "❚❚ Pausar"; auto = setInterval(() => { pos < total() - 1 ? ir(caso, pos + 1) : parar(); }, 3200); });
document.addEventListener("keydown", e => { if (e.target.closest("input")) return; if (e.key === "ArrowRight") ir(caso, pos + 1); if (e.key === "ArrowLeft") ir(caso, pos - 1); });
(function visor() {
  const cv = $("c3d"); let a = null;
  cv.addEventListener("pointerdown", e => { a = [e.clientX, e.clientY, vista.az, vista.el]; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* puntero sintético */ } });
  cv.addEventListener("pointermove", e => { if (!a) return; vista.az = a[2] - (e.clientX - a[0]) * 0.008; vista.el = Math.min(1.5, Math.max(0.05, a[3] + (e.clientY - a[1]) * 0.008)); dibujar(); });
  cv.addEventListener("pointerup", () => { a = null; });
  $("zoom").addEventListener("input", e => { vista.dist = +e.target.value; dibujar(); });
  $("vista-cero").addEventListener("click", () => { Object.assign(vista, ESCENAS[caso][1]); $("zoom").value = vista.dist; dibujar(); });
  window.addEventListener("resize", dibujar);
  let antes = 0;
  (function cuadro(t) {
    const dt = Math.min(0.1, (t - antes) / 1000 || 0); antes = t;
    if (!RAPIDO) {
      const {e} = entorno(), q = seguir(e, dt), gira = caso === "brazo" && q.viva > 0.01, humea = caso === "construccion" && q.humo > 0.04, corre = (caso === "mineria" || caso === "demo") && q.marcha > 0.01;
      if (gira) fase = (fase + dt / 7 * q.viva) % 1;
      if (corre) cinta = (cinta + dt * (caso === "demo" ? 11 : 17) * q.marcha) % (caso === "demo" ? 60 : 75);
      reloj += dt;
      if (enMovimiento || gira || humea || corre) dibujar();
    }
    requestAnimationFrame(cuadro);
  })(0);
})();
(function arranque() {
  const [k, p] = location.hash.replace(/^#/, "").split("/");
  const inicial = k in F.casos ? k : Object.keys(F.casos)[0];
  Object.assign(vista, ESCENAS[inicial][1]); $("zoom").value = vista.dist; $("zoom").min = Math.round(vista.dist * 0.45); $("zoom").max = Math.round(vista.dist * 1.9);
  ir(inicial, parseInt(p, 10) || 0);
  document.body.dataset.listo = "1";
})();
</script>
</body>
</html>
