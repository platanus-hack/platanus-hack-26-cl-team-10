<!-- El flujo completo en una sola pantalla: protocolo, pautas, OT y ejecución, con lo que pasa por detrás
     en cada etapa. Tres casos: el brazo del demo, una celda de media tensión y una excavadora.
     Lo que responde cada llamada y cada tramo del guion sale de correr app/ en una base en memoria;
     las pautas de energía y construcción son las de datos/. Lo que no está construido va marcado.
     Un solo archivo, sin build ni red. Si el código cambia, se corrige en el mismo commit. -->
<style>
:root{--ink:#16202b;--muted:#5b6673;--line:#d9dee5;--soft:#f1f3f6;--bg:#f7f8fa;--paper:#fff;--brand:#2f5f9e;--brand-soft:#e7eef8;

*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
button,input{font:inherit} button{cursor:pointer}
code{font-family:var(--mono);font-size:15px;background:var(--soft);padding:1px 5px;border-radius:5px}

p{margin:0 0 8px}
header{background:var(--deep);color:#eef2f7;padding:20px 0 16px}
header p{color:#b8c2cf;margin:0;max-width:880px}
.barra{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.barra .wrap{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
#casos{display:flex;gap:8px;flex-wrap:wrap}

#casos button b{display:block;font-size:15px} #casos button small{color:var(--muted);font-size:15px}
#casos button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff} #casos button[aria-pressed=true] small{color:#b8c2cf}
#flujo{list-style:none;margin:0 0 0 auto;padding:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#flujo .fl{color:var(--muted);align-self:flex-end;padding-bottom:14px}
#flujo .grupo{display:grid;gap:3px} #flujo .grupo>span{font-size:15px;color:var(--muted);font-weight:600} #flujo .grupo>div{display:flex;align-items:center;gap:4px} #flujo .grupo i{font-style:normal;color:var(--muted)}
#flujo button{border:1px solid var(--line);border-bottom:4px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;text-align:left;color:var(--ink);line-height:1.25;min-width:124px}
#flujo button b{display:block;font-size:15px} #flujo button small{color:var(--muted);font-size:15px}
#flujo button.hecha{border-bottom-color:#8fa3bd} #flujo button.actual{border-color:var(--ink);border-bottom-color:var(--brand);background:#fbfcfd}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;padding-top:18px;padding-bottom:40px;align-items:start}
@media (max-width:1040px){main{grid-template-columns:1fr} #flujo{margin-left:0}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mandos{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.boton{background:var(--paper);color:var(--ink);border:1px solid #b9c2ce;border-radius:9px;padding:7px 14px;font-weight:600}
.boton.primario{background:var(--deep);border-color:var(--deep);color:#fff} .boton:disabled{opacity:.4;cursor:not-allowed}
#cuenta{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.visor{position:relative;border-radius:14px;overflow:hidden;background:var(--deep);margin-top:12px}
.visor canvas{display:block;width:100%;height:440px;touch-action:none;cursor:grab} .visor canvas:active{cursor:grabbing}
.visor .pie-v{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#b8c2cf;font-size:15px;pointer-events:none}
.visor .pie-v>*{background:rgba(20,28,38,.84);border-radius:8px;padding:3px 10px;pointer-events:auto;display:flex;align-items:center;gap:8px}
.visor .pie-v button{background:none;border:0;color:#b8c2cf;padding:0;text-decoration:underline}
.visor input{width:110px;accent-color:#7fa6dd}
.papel{background:#fffdf6;border:1px solid #e6dfc8;border-radius:6px;padding:14px 18px;font-family:Georgia,"Times New Roman",serif;max-height:300px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.papel b{font-size:17px} .papel small{display:block;color:var(--muted);margin-bottom:6px;font-size:15px} .papel ol{margin:0;padding-left:22px} .papel li{margin:0 0 4px}
.pasos-p{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.pasos-p li{border:1px solid var(--line);border-left:5px solid #c4ccd6;border-radius:9px;padding:6px 10px;margin:0 0 6px;font-size:15px}
.pasos-p li.critico{border-left-color:var(--err)} .pasos-p li>span:last-child{display:block;color:var(--muted)}
.ev{display:inline-block;font-size:15px;font-weight:700;border-radius:6px;padding:0 7px}
.ev.sensor{background:var(--brand-soft);color:var(--brand)} .ev.camara{background:var(--teal-bg);color:var(--teal)} .ev.persona{background:var(--persona-bg);color:var(--persona)} .ev.critico{background:var(--err-bg);color:var(--err)}
.ot-card{border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:4px} .ot-card b{font-family:var(--mono);font-size:18px} .ot-card span{color:var(--muted)}
.badge{display:inline-block;font-size:15px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warning{background:var(--warn-bg);color:var(--warn)} .badge.error{background:var(--err-bg);color:var(--err)} .badge.gris{background:var(--soft);color:var(--muted)}
aside h2{display:flex;align-items:center;gap:10px}
.pieza{position:relative;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:12px 14px 10px;margin:0 0 10px;font-size:15px}
.pieza.no{border:2px dashed var(--stub);border-left:5px solid var(--stub);background:repeating-linear-gradient(135deg,#eceff3 0 12px,#f7f8fa 12px 24px)}
.pieza h4:first-of-type{margin-top:0;color:var(--ink);font-size:16px}
.pieza .tag{float:right;font-size:15px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--ok);border-radius:6px;padding:0 8px;margin-left:8px}
.pieza.no .tag{background:var(--stub)}
.pieza pre{font-family:var(--mono);font-size:14.5px;background:var(--deep);color:#dfe7f1;border-radius:9px;padding:8px 10px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.entra{margin:0;padding-left:20px} .entra li{margin:0 0 6px}
details{margin-top:4px} summary{cursor:pointer;color:var(--brand);font-size:15px} .cita{font-style:italic;color:#3c4653;margin:6px 0 0} .campos{margin:6px 0 0;line-height:1.9}
.atada{font-size:15px;margin:0 0 8px}
.nota{color:var(--muted);font-size:15px} .nota.borde{border-left:4px solid var(--stub);padding-left:10px;margin-top:10px}
.inventario{list-style:none;margin:4px 0 8px;padding:0} .inventario li{margin:0 0 4px} .inventario i{font-style:normal;font-family:var(--mono);background:var(--soft);border-radius:5px;padding:0 5px}
.inventario small{display:block;color:var(--muted);font-size:15px}
.lecturas{display:flex;flex-wrap:wrap;gap:6px} .lecturas span{font-family:var(--mono);font-size:15px;background:var(--soft);border-radius:6px;padding:1px 8px;color:var(--muted)}
.lecturas span.cambio{background:var(--brand-soft);color:var(--brand);font-weight:700;outline:1.5px solid var(--brand)}
.revisiones{list-style:none;margin:0;padding:0;counter-reset:r} .revisiones li{counter-increment:r;padding:4px 10px 4px 34px;margin:0 0 4px;border-radius:8px;background:var(--soft);color:var(--muted);position:relative}
.revisiones li::before{content:counter(r);position:absolute;left:9px;top:5px;width:18px;height:18px;border-radius:50%;background:#c4ccd6;color:#fff;font-size:13px;font-weight:700;text-align:center;line-height:18px}
.revisiones li b{color:var(--ink)} .revisiones li.ok{background:var(--ok-bg);color:var(--ink)} .revisiones li.err{background:var(--err-bg);color:var(--ink)}
.revisiones li.ok::before{background:var(--ok)} .revisiones li.err::before{background:var(--err)}
.bitacora{list-style:none;margin:0;padding:0} .bitacora li{padding:5px 10px;border-radius:8px;margin:0 0 4px;background:var(--soft);border-left:4px solid #c4ccd6}
.bitacora li.ok{border-left-color:var(--ok)} .bitacora li.warning{border-left-color:var(--warn);background:var(--warn-bg)} .bitacora li.error{border-left-color:var(--err);background:var(--err-bg)}
.bitacora b{font-family:var(--mono)}
.tel{background:var(--deep);border-radius:14px;padding:12px;color:#eef2f7;margin:0 0 10px}
.tel .barra-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#b8c2cf;font-size:15px}
.tel ol{list-style:none;margin:0;padding:0;font-size:15px}
.tel li{display:flex;gap:8px;align-items:center;margin:0 0 4px;padding:4px 9px;border-radius:8px;background:#1d2734;color:#aeb9c7;border-left:4px solid #3a475a}
.tel li .num{font-family:var(--mono);font-weight:700;color:#7d8a9b} .tel li .tit{flex:1} .tel li .tit i{font-style:normal;color:#f0a09a}
.tel li .cap{font-family:var(--mono);font-size:14px;color:#8fa0b5;white-space:nowrap}
.tel li.verificado{background:#173326;color:#a6e9c5;border-left-color:#3fbf85} .tel li.en_conflicto{background:#3b1717;color:#ffb4ad;border-left-color:#f0655a} .tel li.actual{outline:2px solid #7fa6dd;color:#fff}
.tel .aviso{font-size:15px;padding:7px 10px;border-radius:9px;margin:6px 0 0} .tel .aviso.error{background:#3b1717;color:#ffb4ad} .tel .aviso.warning{background:#3a2e10;color:#ffd97a}
.tel .aviso small{display:block;opacity:.9} .tel .sin{font-size:15px;color:#8fe0b4;margin-top:6px}
</style>
</head>

<header><div class="wrap">
  <h1>Del protocolo a la OT ejecutada</h1>

</div></header>
<div class="barra"><div class="wrap"><div id="casos" role="group" aria-label="Casos"></div><ol id="flujo" aria-label="Etapas"></ol></div></div>

    <div class="card"><div id="vista"></div>
      <div class="mandos"><button class="boton" id="atras">← Atrás</button><button class="boton primario" id="sigue">Siguiente →</button><button class="boton" id="auto">▶ Reproducir</button><span id="cuenta"></span><button class="boton" id="cero" style="margin-left:auto">Volver al inicio</button></div>

  </section>
  <aside><h2>Por detrás</h2><div id="detras"></div></aside>
</main>

    d = bloque(false, "<code>POST /protocolos/{id}/ots</code>", "<p>El sistema del cliente pide una OT de una pauta de su protocolo, sin conocer ids internos. Falta que la pauta sepa de qué protocolo es: una columna en su tabla.</p>")
      + bloque(true, `<code>POST /ot/${c.ot}/abrir</code>`, `<p>Solo desde una pauta aprobada. Guarda la versión y escribe la primera fila de la bitácora: «${esc(c.apertura[0][1])}».</p><pre>${jsonCorto(c.real.abrir)}</pre>`)
      + bloque(true, `<code>POST /ot/${c.ot}/asignar</code>`, `<p>Un supervisor la deja en manos de un operador. Quién la tiene se lee de la bitácora, no de una columna.</p><pre>${jsonCorto(a, ["operador", "estado_general", "cerrados", "total"])}</pre>`)
      + bloque(true, `<code>POST /ot/${c.ot}/sesion</code>`, `<p>Une el edge de la estación con la OT. Desde aquí cada lectura de ese edge entra a esta OT y solo a esta.</p><pre>${jsonCorto(c.real.sesion)}</pre>`);
  } else {
    const i = pos - 3, t = c.guion[i], tr = E.tramos[i], cal = E.cal;
    v = `<h3>${esc(t.t)}</h3><p>${esc(t.x)}</p>`;
    const de = pre => tr.eventos.filter(ev => (ev.evidencia || {}).clave && ev.evidencia.clave.startsWith(pre));
    const fila = (nombre, lista, calma) => { const ab = lista.find(ev => ev.tipo === "alerta"), re = lista.find(ev => ev.tipo === "alerta_resuelta"); return `<li class="${ab ? "err" : re ? "ok" : ""}"><b>${nombre}</b> ${ab ? "abre una alerta" : re ? "resuelve la alerta" : calma}</li>`; };
    const cierre = tr.eventos.filter(ev => ev.tipo === "veredicto" && ev.capa === 1 && ev.estado === "verificado");
    let entro = "", revisa = "";
    if (t.pon) {
      entro += `<p><code>POST /edge/${c.edge}/lecturas</code></p><p class="lecturas">${c.orden.map(s => `<span class="${tr.cambios.includes(s) ? "cambio" : ""}">${s} = ${E.sensores[s]}</span>`).join("")}</p>`;
      revisa += `<ol class="revisiones">${fila("Seguridad", de("seguridad:"), "sin peligro")}<li class="${cierre.length ? "ok" : ""}"><b>Paso actual</b> ${cierre.length ? "cierra " + cierre.map(ev => ev.paso_id).join(" y ") : "ninguna lectura lo cierra"}</li>${fila("Controles", de("control:"), "ninguno deshecho")}${fila("Orden", de("orden:"), "nada adelantado")}<li><b>Señal</b> no hay lecturas numéricas</li></ol>`;
    }
    if (t.dice) {
      const v2 = tr.eventos.filter(ev => ev.tipo === "veredicto").at(-1);
      entro += `<p><code>POST /ot/${c.ot}/declarar</code> «${esc(t.dice)}»</p>`;
      revisa += v2.capa === 3 ? `<ol class="revisiones"><li><b>Detector</b> el paso no trae una clase que conozca: no decide</li><li class="ok"><b>Juez de cámara</b> responde sí con ${corto(K.CONF_FORZADA)} a «${esc(E.motor.pasos.find(x => x.id === v2.paso_id).pregunta_visual)}»</li></ol><p class="nota">La respuesta del juez está fijada para esta corrida. En vivo responde el modelo de visión sobre el cuadro.</p>`
        : `<ol class="revisiones"><li class="ok"><b>Confirmación</b> el paso se cierra con la palabra del operario</li></ol>`;
    }
    d = `<div class="tel"><div class="barra-t"><span>${esc(c.ot)} · ${c.real.asignar.operador}</span><span><span class="badge ${cal.nivel}">${cal.nivel}</span></span></div>
      <ol>${E.motor.pasos.map(x => { const est = E.estados[x.id] || "no_verificado"; return `<li class="${est} ${E.actual && E.actual.id === x.id ? "actual" : ""}"><span class="num">${x.orden}</span><span class="tit">${esc(x.titulo)}${x.control_critico ? " <i>crítico</i>" : ""}</span><span class="cap">${x.sensor ? `${x.sensor.id} = ${x.sensor.espera}` : x.tipo_evidencia === "camara" ? "cámara" : "confirmación"}</span></li>`; }).join("")}</ol>
      ${cal.avisos.map(a => `<div class="aviso ${a.nivel}"><b>${a.nivel.toUpperCase()}</b> · capa ${a.capa}${a.nivel === "error" ? " · interrumpe" : ""}<small>${esc(a.motivos[0])}</small></div>`).join("") || `<div class="sin">${E.completa ? "OT completa, sin avisos." : "Sin avisos activos."}</div>`}</div>
      <div class="pieza si"><span class="tag">construido</span><h4>Lo que entró</h4>${entro}<h4>Qué lo revisó</h4>${revisa}
      <h4>Lo que quedó en la bitácora</h4><ol class="bitacora">${tr.eventos.map(ev => { const q = E.motor.calificarEvento(ev); return `<li class="${q ? q.nivel : ""}"><b>${ev.tipo}</b>${ev.paso_id ? " " + ev.paso_id : ""}${ev.capa ? " · capa " + ev.capa : ev.tipo === "veredicto" ? " · persona" : ""}<br>${esc(ev.detalle)}</li>`; }).join("") || "<li>Nada: ninguna lectura cambió algo.</li>"}</ol>
      <p class="nota">Cada fila sale al instante por <code>WS /ot/${c.ot}/stream</code>, con la calificación de la OT.</p></div>`
      + (caso === "brazo" ? `<p class="nota borde">En este caso no están construidos el relé, el corte local del ESP32 ni la regla «${esc(F.regla[1].split(".")[0].toLowerCase())}». La pauta es un borrador. La lógica que responde sí es la del servidor.</p>` : "");
  }
  $("vista").innerHTML = v; $("detras").innerHTML = d;
  if (RAPIDO || !poses[caso]) seguir(entorno().e);
  dibujar();
  document.body.dataset.flujo = [caso, pos, pos >= 3 ? E.cal.nivel : "-", pos >= 3 ? (E.actual ? E.actual.id : "completa") : "-"].join(":");
}
function ir(k, p) { caso = k in F.casos ? k : "brazo"; pos = Math.max(0, Math.min(total() - 1, p | 0)); const h = `#${caso}/${pos}`; if (location.hash !== h) history.replaceState(null, "", h); pintar(); }
function elegirCaso(k) { parar(); Object.assign(vista, ESCENAS[k][1]); $("zoom").value = vista.dist; $("zoom").min = Math.round(vista.dist * 0.45); $("zoom").max = Math.round(vista.dist * 1.9); ir(k, 0); }

$("casos").innerHTML = Object.entries(F.casos).map(([k, c]) => `<button data-caso="${k}" aria-pressed="false"><b>${esc(c.nombre)}</b><small>${esc(c.sub)}</small></button>`).join("");
$("casos").addEventListener("click", e => { const b = e.target.closest("[data-caso]"); if (b) elegirCaso(b.dataset.caso); });
$("flujo").addEventListener("click", e => { const b = e.target.closest("[data-etapa]"); if (b) ir(caso, +b.dataset.etapa); });
let auto = null;
const parar = () => { clearInterval(auto); auto = null; $("auto").textContent = "▶ Reproducir"; };
$("atras").addEventListener("click", () => { parar(); ir(caso, pos - 1); }); $("sigue").addEventListener("click", () => { parar(); ir(caso, pos + 1); }); $("cero").addEventListener("click", () => { parar(); ir(caso, 0); });
$("auto").addEventListener("click", () => { if (auto) return parar(); if (pos === total() - 1) ir(caso, 0); $("auto").textContent = "❚❚ Pausar"; auto = setInterval(() => { pos < total() - 1 ? ir(caso, pos + 1) : parar(); }, 3200); });
document.addEventListener("keydown", e => { if (e.target.closest("input")) return; if (e.key === "ArrowRight") ir(caso, pos + 1); if (e.key === "ArrowLeft") ir(caso, pos - 1); });
(function visor() {
  const cv = $("c3d"); let a = null;
  cv.addEventListener("pointerdown", e => { a = [e.clientX, e.clientY, vista.az, vista.el]; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* puntero sintético */ } });
  cv.addEventListener("pointermove", e => { if (!a) return; vista.az = a[2] - (e.clientX - a[0]) * 0.008; vista.el = Math.min(1.5, Math.max(0.05, a[3] + (e.clientY - a[1]) * 0.008)); dibujar(); });
  cv.addEventListener("pointerup", () => { a = null; });
  $("zoom").addEventListener("input", e => { vista.dist = +e.target.value; dibujar(); });
  $("vista-cero").addEventListener("click", () => { Object.assign(vista, ESCENAS[caso][1]); $("zoom").value = vista.dist; dibujar(); });
  window.addEventListener("resize", dibujar);
  let antes = 0;
  (function cuadro(t) {
    const dt = Math.min(0.1, (t - antes) / 1000 || 0); antes = t;
    if (!RAPIDO) {
      const {e} = entorno(), q = seguir(e, dt), gira = caso === "brazo" && q.viva > 0.01, humea = caso === "construccion" && q.humo > 0.04;
      if (gira) fase = (fase + dt / 7 * q.viva) % 1;
      reloj += dt;
      if (enMovimiento || gira || humea) dibujar();
    }
    requestAnimationFrame(cuadro);
  })(0);
})();
(function arranque() {
  const [k, p] = location.hash.replace(/^#/, "").split("/");
  const inicial = k in F.casos ? k : "brazo";
  Object.assign(vista, ESCENAS[inicial][1]); $("zoom").value = vista.dist; $("zoom").min = Math.round(vista.dist * 0.45); $("zoom").max = Math.round(vista.dist * 1.9);
  ir(inicial, parseInt(p, 10) || 0);
  document.body.dataset.listo = "1";
})();
</script>
</body>
